name: Build chip-build arm64 (fork)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build chip-build
        run: |
          cd integrations/docker/images/base/chip-build
          DOCKER_BUILD_ORG=rquidute ./build.sh
      - name: Push to ghcr.io
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version=$(sed 's/ .*//' integrations/docker/images/base/chip-build/version)
          docker push "ghcr.io/rquidute/chip-build:$version"
